<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florian Marcel — Apps</title>
<meta name="description" content="Applications mobiles créées par Florian Marcel.">
<style>
  :root {
    --bg: #f6f7f9;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --text-muted: #666b75;
    --border: #e6e8eb;
    --accent: #3a6df0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card-bg: #1e2126;
      --text: #f0f1f3;
      --text-muted: #9a9fa8;
      --border: #2c2f36;
      --accent: #6c93ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 20px 24px;
    text-align: center;
  }
  header h1 {
    font-size: 1.8rem;
    margin: 0 0 8px;
  }
  header p {
    color: var(--text-muted);
    margin: 0;
    font-size: 1rem;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px 20px 56px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media (min-width: 560px) {
    main { grid-template-columns: 1fr 1fr; }
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .card img {
    width: 56px;
    height: 56px;
    border-radius: 13px;
    flex-shrink: 0;
    object-fit: cover;
  }
  .card .info h2 {
    font-size: 1.05rem;
    margin: 0 0 3px;
  }
  .card .info p {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin: 0;
  }
  footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px 56px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.8rem;
  }
  footer a { color: var(--text-muted); }
</style>
</head>
<body>
  <header>
    <h1>Florian Marcel</h1>
    <p>Développeur indépendant d'applications mobiles</p>
  </header>
  <main>
    <a class="card" href="https://apps.apple.com/us/app/tiltboat/id6796813347">
      <img src="images/tiltboat.png" alt="TiltBoat">
      <div class="info">
        <h2>TiltBoat</h2>
        <p>Ton bateau qui tangue au tilt</p>
      </div>
    </a>
    <a class="card" href="https://apps.apple.com/us/app/weave-moto/id6807174206">
      <img src="images/weave.png" alt="Weave">
      <div class="info">
        <h2>Weave</h2>
        <p>Esquive le trafic à moto</p>
      </div>
    </a>
    <a class="card" href="https://apps.apple.com/us/app/countit-private-log/id6790743817">
      <img src="images/countit.png" alt="CountIt">
      <div class="info">
        <h2>CountIt</h2>
        <p>Carnet intime &amp; prévention</p>
      </div>
    </a>
    <a class="card" href="https://apps.apple.com/us/app/bonnedatemeteo/id6809931304">
      <img src="images/bonnedatemeteo.png" alt="BonneDateMétéo">
      <div class="info">
        <h2>BonneDateMétéo</h2>
        <p>Météo historique événements</p>
      </div>
    </a>
    <a class="card" href="https://apps.apple.com/us/app/cornall/id6805999212">
      <img src="images/cornall.png" alt="CornAll">
      <div class="info">
        <h2>CornAll</h2>
      </div>
    </a>
    <a class="card" href="https://apps.apple.com/us/app/souffly/id6804810131">
      <img src="images/souffly.png" alt="Souffly">
      <div class="info">
        <h2>Souffly</h2>
      </div>
    </a>
  </main>
  <footer>
    <p>© 2026 Florian Marcel</p>
  </footer>
</body>
</html>
